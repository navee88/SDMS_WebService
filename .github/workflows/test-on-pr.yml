name: Check Conflicts and Merge

on:
  pull_request:
    branches:
      - develop  # Runs when merging into develop

permissions:
  contents: write      # Required for checking code and merging
  pull-requests: write # Required for auto-merging

jobs:
  check-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- Safety Step: Prevent changes to config.js ---
      - name: Check for restricted file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            config_change:
              - 'src/Api/config.js'

      - name: Fail if Config File Modified
        if: steps.filter.outputs.config_change == 'true'
        run: |
          echo "::error::Changes to 'src/Api/config.js' are not allowed!"
          echo "Please revert changes to this file and push again."
          exit 1

      # --- Merge Step: Runs only if safety check passes ---
      - name: Auto Merge if Safe
        run: gh pr merge --auto --merge "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
