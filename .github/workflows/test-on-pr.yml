name: Check Conflicts and Merge

on:
  pull_request:
    branches:
      - develop  # Runs when merging into develop

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # GitHub Actions won't even reach this step if there are fundamental git conflicts
      # that prevent checkout. If checkout succeeds, we try to merge.
      
      - name: Auto Merge if No Conflicts
        run: gh pr merge --auto --merge "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
